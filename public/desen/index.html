<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <title>404 Not Found</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #000;
            color: #333;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .error-container {
            width: 100%;
            padding: 20px;
            text-align: center;
            transform: translateY(-4%);
        }

        .error-code {
            font-size: clamp(90px, 18vw, 180px);
            font-weight: 700;
            line-height: 0.9;
            letter-spacing: -8px;
            color: #292929;
        }

        .error-title {
            margin-top: 22px;
            font-size: clamp(22px, 4vw, 34px);
            font-weight: 700;
            color: #242424;
        }

        .error-message {
            margin-top: 22px;
            font-size: clamp(11px, 2vw, 15px);
            color: #1b1b1b;
        }

        @media (max-width: 600px) {
            .error-container {
                transform: translateY(-8%);
            }

            .error-code {
                letter-spacing: -5px;
            }

            .error-title {
                margin-top: 16px;
            }

            .error-message {
                margin-top: 18px;
            }
        }
    </style>
</head>

<body>

    <main class="error-container">
        <div class="error-code">404</div>

        <div class="error-title">
            Not Found
        </div>

        <div class="error-message">
            The resource requested could not be found on this server!
        </div>
    </main>

</body>
</html>
